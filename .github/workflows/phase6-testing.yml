name: Phase 6 - Comprehensive Testing Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: true
        default: 'full'
        type: choice
        options:
        - unit
        - integration
        - e2e
        - full

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # Quality Gates - Code Quality Checks
  code-quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          backend:
            - 'backend/**'
          frontend:
            - 'frontend-web/**'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend-web/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install frontend dependencies
      if: steps.changes.outputs.frontend == 'true'
      working-directory: frontend-web
      run: npm ci

    - name: Install backend dependencies
      if: steps.changes.outputs.backend == 'true'
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Frontend linting
      if: steps.changes.outputs.frontend == 'true'
      working-directory: frontend-web
      run: |
        npm run lint
        npm run type-check

    - name: Backend linting
      if: steps.changes.outputs.backend == 'true'
      working-directory: backend
      run: |
        flake8 app/ tests/ --max-line-length=100 --exclude=migrations
        black --check app/ tests/
        isort --check-only app/ tests/

    - name: Security scanning
      uses: github/super-linter@v4
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_PYTHON_FLAKE8: true
        VALIDATE_TYPESCRIPT_ES: true
        VALIDATE_DOCKERFILE: true

  # Backend Testing Pipeline
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.backend-changed == 'true'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: halicred_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Setup test environment
      working-directory: backend
      run: |
        cp .env.example .env.test
        echo "DATABASE_URL=postgresql://test:test@localhost:5432/halicred_test" >> .env.test
        echo "REDIS_URL=redis://localhost:6379/0" >> .env.test

    - name: Run database migrations
      working-directory: backend
      run: |
        export DATABASE_URL=postgresql://test:test@localhost:5432/halicred_test
        alembic upgrade head

    - name: Run unit tests
      working-directory: backend
      run: |
        python run_tests.py unit --coverage
      env:
        TESTING: true
        DATABASE_URL: postgresql://test:test@localhost:5432/halicred_test
        REDIS_URL: redis://localhost:6379/0

    - name: Run integration tests
      working-directory: backend
      run: |
        python run_tests.py integration --coverage
      env:
        TESTING: true
        DATABASE_URL: postgresql://test:test@localhost:5432/halicred_test
        REDIS_URL: redis://localhost:6379/0

    - name: Run API tests
      working-directory: backend
      run: |
        python run_tests.py api --coverage
      env:
        TESTING: true
        DATABASE_URL: postgresql://test:test@localhost:5432/halicred_test
        REDIS_URL: redis://localhost:6379/0

    - name: Run security tests
      working-directory: backend
      run: |
        python run_tests.py security
      env:
        TESTING: true
        DATABASE_URL: postgresql://test:test@localhost:5432/halicred_test
        REDIS_URL: redis://localhost:6379/0

    - name: Generate coverage report
      working-directory: backend
      run: |
        python run_tests.py coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: backend/coverage.xml
        flags: backend
        name: backend-coverage

    - name: Coverage quality gate
      working-directory: backend
      run: |
        coverage report --fail-under=80

  # Frontend Testing Pipeline
  frontend-tests:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.outputs.frontend-changed == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend-web/package-lock.json

    - name: Install dependencies
      working-directory: frontend-web
      run: npm ci

    - name: Run unit tests
      working-directory: frontend-web
      run: npm run test:coverage

    - name: Run component tests
      working-directory: frontend-web
      run: npm run test -- --testPathPattern="Components.*test\.(ts|tsx)$"

    - name: Run hook tests
      working-directory: frontend-web
      run: npm run test -- --testPathPattern="hooks.*test\.(ts|tsx)$"

    - name: Build application
      working-directory: frontend-web
      run: npm run build

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: frontend-web/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

    - name: Coverage quality gate
      working-directory: frontend-web
      run: |
        npx nyc check-coverage --lines 75 --functions 75 --branches 75 --statements 75

  # End-to-End Testing
  e2e-tests:
    name: End-to-End Test Suite
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: |
      always() &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: halicred_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend-web/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend && pip install -r requirements.txt
        cd ../frontend-web && npm ci

    - name: Setup E2E environment
      run: |
        cd backend
        cp .env.example .env.e2e
        echo "DATABASE_URL=postgresql://test:test@localhost:5432/halicred_e2e" >> .env.e2e
        echo "REDIS_URL=redis://localhost:6379/1" >> .env.e2e
        echo "ENVIRONMENT=test" >> .env.e2e

    - name: Start backend server
      working-directory: backend
      run: |
        export DATABASE_URL=postgresql://test:test@localhost:5432/halicred_e2e
        export REDIS_URL=redis://localhost:6379/1
        alembic upgrade head
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        TESTING: true

    - name: Create test fixtures
      working-directory: frontend-web
      run: node src/e2e/fixtures/create-test-files.js

    - name: Install Playwright browsers
      working-directory: frontend-web
      run: npx playwright install --with-deps

    - name: Run E2E tests
      working-directory: frontend-web
      run: npm run test:e2e
      env:
        E2E_BASE_URL: http://localhost:5173
        API_BASE_URL: http://localhost:8000

    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-results
        path: |
          frontend-web/test-results/
          frontend-web/playwright-report/

  # Performance Testing
  performance-tests:
    name: Performance Test Suite
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: |
      always() &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install backend dependencies
      working-directory: backend
      run: |
        pip install -r requirements.txt
        pip install locust

    - name: Run backend performance tests
      working-directory: backend
      run: |
        python run_tests.py performance
      timeout-minutes: 10

    - name: Setup Node.js for frontend performance
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install frontend dependencies
      working-directory: frontend-web
      run: npm ci

    - name: Run Lighthouse CI
      working-directory: frontend-web
      run: |
        npm install -g @lhci/cli
        npm run build
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Security Testing
  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=high

    - name: Run OWASP ZAP security scan
      if: github.event_name == 'pull_request'
      uses: zaproxy/action-full-scan@v0.4.0
      with:
        target: 'http://localhost:5173'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

  # Quality Gates Summary
  quality-gates:
    name: Quality Gates Summary
    runs-on: ubuntu-latest
    needs: [code-quality, backend-tests, frontend-tests, e2e-tests, security-tests]
    if: always()

    steps:
    - name: Check quality gates
      run: |
        echo "=== Quality Gates Summary ==="
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "E2E Tests: ${{ needs.e2e-tests.result }}"
        echo "Security Tests: ${{ needs.security-tests.result }}"

        # Determine overall status
        if [[ "${{ needs.code-quality.result }}" == "success" && \
              ("${{ needs.backend-tests.result }}" == "success" || "${{ needs.backend-tests.result }}" == "skipped") && \
              ("${{ needs.frontend-tests.result }}" == "success" || "${{ needs.frontend-tests.result }}" == "skipped") && \
              ("${{ needs.e2e-tests.result }}" == "success" || "${{ needs.e2e-tests.result }}" == "skipped") && \
              "${{ needs.security-tests.result }}" == "success" ]]; then
          echo "✅ All quality gates passed!"
          echo "QUALITY_GATE_STATUS=PASSED" >> $GITHUB_ENV
        else
          echo "❌ Quality gates failed!"
          echo "QUALITY_GATE_STATUS=FAILED" >> $GITHUB_ENV
          exit 1
        fi

    - name: Create quality gate badge
      if: always()
      run: |
        if [[ "$QUALITY_GATE_STATUS" == "PASSED" ]]; then
          echo "![Quality Gate](https://img.shields.io/badge/Quality%20Gate-PASSED-brightgreen)" > quality-gate.md
        else
          echo "![Quality Gate](https://img.shields.io/badge/Quality%20Gate-FAILED-red)" > quality-gate.md
        fi

    - name: Upload quality gate results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-gate-results
        path: quality-gate.md

  # Deployment Gate (only on main branch)
  deployment-gate:
    name: Deployment Readiness Gate
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.ref == 'refs/heads/main' && needs.quality-gates.result == 'success'

    steps:
    - name: Deployment readiness check
      run: |
        echo "🚀 All quality gates passed - Ready for deployment!"
        echo "DEPLOYMENT_READY=true" >> $GITHUB_ENV

    - name: Trigger deployment workflow
      if: env.DEPLOYMENT_READY == 'true'
      uses: peter-evans/repository-dispatch@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        event-type: deploy-production
        client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'